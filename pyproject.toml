[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "security-platform"
version = "0.1.0"
description = "Security monitoring, threat detection, and response platform for WHM/cPanel servers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "geoip2>=4.8.0",
  "httpx>=0.28.0",
  "jinja2>=3.1.0",
  "passlib[bcrypt]>=1.7.4",
  "psutil>=6.0.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0.2",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.31.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["core*", "detectors*", "responders*", "alerts*", "api*", "dashboard*"]
